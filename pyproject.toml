[project]
name = "codelattice"
version = "0.1.0"
description = "Code knowledge graph for Claude Code — semantic code search, symbol lookup and dependency analysis that cut token usage"
readme = "README.md"
license = "MIT"
authors = [{ name = "smrf1093" }]
keywords = ["claude", "claude-code", "mcp", "code-search", "knowledge-graph", "tree-sitter", "semantic-search"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development",
]
requires-python = ">=3.11,<3.13"
dependencies = [
    "cognee>=0.5.0",
    "mcp[cli]>=1.26,<2",
    "tree-sitter>=0.23.0",
    "tree-sitter-python",
    "tree-sitter-javascript",
    "tree-sitter-typescript",
    "pathspec>=0.12",
    "pydantic-settings>=2.0",
    "click>=8.0",
]

[project.urls]
Homepage = "https://smrf1093.github.io/CodeLattice"
Repository = "https://github.com/smrf1093/CodeLattice"
Issues = "https://github.com/smrf1093/CodeLattice/issues"

[project.scripts]
codelattice = "codelattice.cli:main"

[project.optional-dependencies]
watch = [
    "watchfiles>=1.0",
]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
    "watchfiles>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
include = ["/src/codelattice", "/tests", "/README.md", "/LICENSE", "/pyproject.toml"]

[tool.hatch.build.targets.wheel]
packages = ["src/codelattice"]

[tool.ruff]
line-length = 100
target-version = "py311"
